; Shared Samba template for every chassis model.
; Share name, path, masks and group semantics are overwritten at apply time by
; EasySetupConfigurator; `browseable` and `guest ok` are the values that survive.

[global]
    load printers = no
    printcap name = /dev/null
    disable spoolss = yes

[share]
    path = /tank/share
    read only = no
    browseable = yes
    guest ok = no
    directory mask = 2770
    create mask = 0770
    force group = smbusers
